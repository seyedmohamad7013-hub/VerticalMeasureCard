
name: Build Vertical Measure Card

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Power BI Visuals CLI
        run: npm install -g powerbi-visuals-tools@7.2.1

      - name: Install project dependencies
        run: npm install

      - name: Build PBIVIZ package
        continue-on-error: true
        run: pbiviz package

      - name: Verify PBIVIZ package
        shell: bash
        run: |
          set -euo pipefail
          ls -lah dist/

          FILE=$(find dist -maxdepth 1 -name '*.pbiviz' -type f -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: PBIVIZ file not found"
            exit 1
          fi

          unzip -t "$FILE"

          unzip -Z1 "$FILE" | grep -q 'package.json'
          unzip -Z1 "$FILE" | grep -q 'resources/'

          echo "PBIVIZ archive validation passed"

      - name: Upload PBIVIZ
        uses: actions/upload-artifact@v4
        with:
          name: VerticalMeasureCard
          path: dist/*.pbiviz
          if-no-files-found: error
